<style>
:root{

}
*{box-sizing:border-box}

/* Tabs */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 calc(-1*max(20px,env(safe-area-inset-right))) 0 calc(-1*max(20px,env(safe-area-inset-left)));
  padding:10px max(20px,env(safe-area-inset-left)) 10px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);

#map{height:min(58vh,440px);border-radius:12px;border:1px solid var(--line);margin-top:14px;background:var(--panel)}
.pin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#10161A;font:700 14px var(--cond);border:2px solid #10161A;box-shadow:0 1px 4px rgba(0,0,0,.5)}

.row .nm{font-weight:600}

.row .ad{grid-column:2/4;color:var(--muted);font-size:14px}
.contest{background:var(--panel);border-radius:12px;padding:16px;margin-top:4px}

.contest .hd b{font:700 22px var(--cond)}
.contest .hd span{color:var(--muted);font-size:14px}
.guy{display:grid;grid-template-columns:72px 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.guy:first-of-type{border-top:0}
.guy .nm{font:700 20px var(--cond)}
.guy .pr{font:700 20px var(--cond);color:var(--amber);font-variant-numeric:tabular-nums}
.guy .ds{grid-column:1/4;color:var(--muted);font-size:14px}
.meter{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;min-width:0}
.meter i{height:14px;border-radius:2px;background:var(--panel-2)}

.meter i.on.end{background:var(--warn)}

.ms{display:block;margin-top:4px;color:var(--amber);font-style:italic}
.banner{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(235,165,72,.12);border-left:3px solid var(--amber)}
.banner .bn{font:700 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.banner p{margin:2px 0 0}
.guy{grid-template-columns:52px 1fr auto}
.head{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--panel-2);display:grid;place-items:center;font:700 18px var(--cond);color:var(--ink);overflow:hidden;flex:0 0 auto}
.guy .who{display:flex;flex-direction:column;min-width:0}
.guy .cnt{font:700 34px/1 var(--cond);color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}
.guy .cnt small{font-size:15px;color:var(--muted);font-weight:600}
.guy .meter{grid-column:2/4}
.guy .ds{grid-column:1/4}
.meter i.proj{box-shadow:inset 0 0 0 1.5px var(--muted)}
.ctl{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ctl .btn{padding:14px;font-size:20px}
.ctl .plus{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.live{font:600 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--walk)}
.live.off{color:var(--muted)}
.left{margin-top:14px;background:var(--panel);border-radius:12px;padding:12px 14px}
.left .ttl{font:600 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.left .heads{display:grid;gap:10px}
.left .h{display:grid;grid-template-columns:40px 44px 40px 1fr auto;align-items:center;gap:6px}
.mugs{display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-end;height:44px;gap:2px 1px}
.mugs.r{align-content:flex-start}
.mugs img{height:20px;width:auto;display:block}
.left .h .nm2{font:600 17px var(--cond);min-width:0}
.left .h .nm2 small{display:block;color:var(--muted);font:500 13px var(--body)}
.left .h b{font:700 28px var(--cond);color:var(--amber);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:10px;margin-top:6px}
.mini .h{display:flex;align-items:center;gap:4px;font:600 14px var(--cond);color:var(--ink)}
.mini .head{width:22px;height:22px;font-size:11px}
.face{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--panel-2);display:grid;place-items:center;font:700 22px var(--cond);color:var(--ink)}
.guy{grid-template-columns:64px 1fr auto}
.guy .sm{color:var(--muted);font-size:13px}
.grid24{grid-column:1/4;display:grid;grid-template-columns:repeat(6,1fr);gap:4px 6px;padding:8px 10px;background:var(--bg);border-radius:10px}
.grid24 img{height:30px;width:auto;justify-self:center}
.grid24 img.e{opacity:.13;filter:grayscale(1)}
.where{color:var(--walk);font:600 15px var(--cond);margin-top:4px}
.visit{margin-top:14px;background:var(--panel);border-radius:12px;padding:12px 14px}
.visit .vt{font:600 18px var(--cond)}
.visit .actions{margin-top:10px}
.btn[disabled]{opacity:.35;pointer-events:none}
.snap{border:0;padding:0;background:none;cursor:pointer;border-radius:50%;outline-offset:2px}
.snap .head{box-shadow:0 0 0 2px var(--amber)}
.left .h .ctl.sm{grid-column:1/6;margin-top:2px}
.left .h .ctl.sm .btn{padding:8px;font-size:17px}
.tml{display:block;color:var(--walk);font-size:13px}
.tml:empty{display:none}
.mini img.head,.mini span.head{width:22px;height:22px;font-size:11px}
.refresh{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;width:28px;height:28px;font-size:15px;margin-left:6px;cursor:pointer;vertical-align:middle}
.ride{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;border:0;border-radius:999px;padding:10px 16px;
  background:var(--warn);color:#2A0E09;font:700 16px var(--cond);letter-spacing:.02em;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer}
.row.skip{opacity:.45}
.row.skip .nm{text-decoration:line-through}
.tab.skip{opacity:.4;text-decoration:line-through}
:root{--g:#2F7D52;--r:#A8433A}
.betcard{background:var(--panel);border-radius:12px;padding:14px;margin-top:12px}
.bh{display:flex;gap:10px;align-items:center}
.bh b{font:700 22px var(--cond);display:block;line-height:1}
.bh span{color:var(--muted);font-size:13px}
.track{position:relative;margin:14px 8px 0}
.track .dots{position:relative}
.track .dot{position:absolute;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink);opacity:.85}
.track .barwrap{position:relative;height:22px;margin-top:4px}
.track .bar{position:absolute;inset:0;border-radius:6px}
.track .mean{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink)}
.track .livept{position:absolute;top:50%;height:34px;transform:translate(-50%,-55%);filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.track .ticks,.track .meanrow{position:relative;height:16px;margin-top:4px}
.track .ticks span{position:absolute;transform:translateX(-50%);font:500 11px var(--body);color:var(--muted)}
.track .meanrow{height:20px;margin-top:2px}
.track .meanrow span{position:absolute;transform:translateX(-50%);font:700 13px var(--cond);background:var(--ink);color:var(--bg);padding:0 6px;border-radius:4px;white-space:nowrap}
.vd .now{color:var(--amber)}
.vd{margin:10px 0 0;font-size:14px;color:var(--muted)}
.vd b{color:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:22px;height:10px;border-radius:3px;display:inline-block}
.betform{background:var(--panel);border-radius:12px;padding:14px;display:grid;gap:10px}
.betform label{display:grid;gap:4px;font:600 15px var(--cond);color:var(--muted)}
.betform input,.betform select{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px var(--body)}
.fhead{margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.fhead b{display:block;font:700 20px var(--cond);color:var(--ink)}
.fhead span{color:var(--muted);font-size:14px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.list li.locked{color:var(--muted);font-style:italic}
.by{color:var(--muted);font-size:13px}
.mapbtns{display:flex;gap:8px;margin-top:12px}
.mapbtns .btn{flex:1;padding:8px;font-size:15px}
#map{margin-top:8px}
.here{color:var(--walk);font-weight:600}
.mk{position:relative;width:28px;height:28px}
.mk .pin{position:absolute;inset:0}
.mk.skip .pin{opacity:.35}
.mk.cur .pin{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(235,165,72,.9)}

@keyframes pulse{50%{box-shadow:0 0 0 3px #fff,0 0 0 12px rgba(235,165,72,0)}}
.mf{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:40px}
.mf .mfh{flex:none;min-width:32px;max-width:32px!important;max-height:32px!important}
.mfh{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#283036;color:#fff;display:grid;place-items:center;font:700 14px var(--cond);box-shadow:0 1px 4px rgba(0,0,0,.5)}

.mb img,.mcount img{height:12px;width:auto}
.mcount{position:absolute;left:20px;top:-10px;display:flex;align-items:center;gap:2px;background:#181D21;color:#EBA548;border:1px solid #EBA548;border-radius:999px;padding:0 6px 0 4px;font:700 13px var(--cond);line-height:18px;white-space:nowrap}
.guy{grid-template-columns:48px 1fr auto;padding:10px 0}
.guy .face{width:44px;height:44px;font-size:18px}

.dcard .list{background:var(--bg);margin-bottom:8px}
.cd{font:600 17px var(--cond);color:var(--walk)}
.sm2{color:var(--muted);font-size:14px}
.checks{display:grid;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer}

.chk b{display:block;font-weight:600}

.adminbar b{color:var(--amber);font:700 15px var(--cond);letter-spacing:.06em;text-transform:uppercase}

.bar-head{display:flex;gap:14px;align-items:flex-start}

.fact{background:var(--panel);border-radius:10px;padding:10px 12px;min-width:0}
.fact .l{font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact .v{font:600 20px/1.15 var(--cond);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font:600 14px var(--cond);letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--ink)}
.chip.cash{background:rgba(240,140,126,.15);color:var(--warn)}
.chip.food{background:rgba(124,196,160,.15);color:var(--walk)}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:16px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:0 0 86%;max-width:86%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;scroll-snap-align:start;background:var(--panel)}
.nophoto{margin-top:16px;border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.nophoto a{color:var(--amber);font-weight:600;text-decoration:none}
.list{background:var(--panel);border-radius:12px;padding:6px 16px;margin:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list b{font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:10px;font:600 17px var(--cond);text-decoration:none;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:24px}
.pager .btn{flex:1}
.pager .btn[disabled]{opacity:.35;pointer-events:none}


@media (prefers-reduced-motion:no-preference){.tab,.btn,.row{transition:background .15s,color .15s}}
</style>
</head>

// Live map: pins for every stop with a location. Once we've been to a bar, each guy's photo and his beers there
// ring the pin when zoomed in; zoomed out, the pin shows one beer total so the Nordeast cluster stays readable.
let map, markerLayer, mapCentered=false;
const FACE_ZOOM=16;
function mapStops(){return allStops().filter(s=>s.lat!=null&&s.lng!=null);}
function initMap(){
  if(map){map.invalidateSize();updateMap();return;}
  if(!window.L){document.getElementById("map").innerHTML='<p style="padding:16px;color:var(--muted)">Map needs a connection. The lists below still work.</p>';return;}
  map=L.map("map",{scrollWheelZoom:false});
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,
    attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, USGS, OpenStreetMap contributors'}).addTo(map);
  const pts=stops.map(s=>[s.lat,s.lng]);
  L.polyline([[homeStop.lat,homeStop.lng],...pts.slice(0,4)],{color:"#3B6E96",weight:4,opacity:.7}).addTo(map);
  L.polyline(pts.slice(3),{color:"#2E6B4F",weight:4,opacity:.7,dashArray:"6 8"}).addTo(map);
  markerLayer=L.layerGroup().addTo(map);
  map.on("zoomend",updateMap);
  centerMap(); updateMap();
}
function crawlStarted(){return typeof state!=="undefined"&&state&&actual().some(s=>visitOf(s.id).arrive);}
function centerMap(whole){

function updateMap(){
  if(!map||!markerLayer)return;

  mapStops().forEach(s=>{
    const here=ps.reduce((n,p)=>n+atBar(s.id,p.id),0), been=!!visitOf(s.id).arrive||here>0||ps.some(p=>barPhoto(s.id,p.id)), isCur=cur&&cur.id===s.id;
    const num=numOf(s), color=s.home?"#ECEFF0":s.extra?"#EBA548":legHex(s);

    if(been&&full){
      deco=ps.map((p,k)=>{const a=Math.PI*(1+(k+1)/(ps.length+1)),x=14+Math.cos(a)*46,y=14+Math.sin(a)*46,n=atBar(s.id,p.id);

    }else if(been)deco=`<span class="mcount"><img src="images/beer.png" alt="">${here}</span>`;
    const icon=L.divIcon({className:"",iconSize:[28,28],iconAnchor:[14,14],
      html:`<div class="mk${isCur?" cur":""}${skipped(s)?" skip":""}"><div class="pin" style="background:${color}">${num}</div>${deco}</div>`});
    const v=visitOf(s.id), times=[v.arrive?"in "+clock(v.arrive):"",v.depart?"out "+clock(v.depart):""].filter(Boolean).join(" · ");
    const m=L.marker([s.lat,s.lng],{icon,zIndexOffset:isCur?1000:been?500:0}).addTo(markerLayer)
      .bindPopup(`<b>${s.extra||s.home?"":num+". "}${s.n}</b><br>${s.home?"Where it all starts":s.extra?"Off-plan stop":"Sat "+s.h}${times?"<br>"+times:""}${been?"<br>"+ps.map(p=>`${p.name} ${atBar(s.id,p.id)}`).join(" · "):""}<br><a href="#${s.id}" data-go="${s.id}">Open tab ›</a>`);
    m.on("mouseover",()=>m.openPopup());

const REPO=(()=>{const h=location.hostname;if(h.endsWith(".github.io"))return{owner:h.split(".")[0],repo:location.pathname.split("/")[1]||h,branch:"main"};return{owner:"mill1016",repo:"octoberside",branch:"main"};})();

const people=()=> (state&&state.people&&state.people.length)?state.people.map(p=>({...defaultPeople.find(d=>d.id===p.id),...p})):defaultPeople;
const atBar=(bar,pid)=>state&&state.bars&&state.bars[bar]&&state.bars[bar][pid]||0;
const visitOf=bar=>state&&state.visits&&state.visits[bar]||{};
// The night as it actually happened: bars you arrived at, by arrival time; then any bar with beers but no arrival, in tab order
function actual(){
  const list=allStops(), arrived=list.filter(s=>visitOf(s.id).arrive).sort((a,b)=>visitOf(a.id).arrive<visitOf(b.id).arrive?-1:1);
  const rest=list.filter(s=>!visitOf(s.id).arrive&&people().some(p=>atBar(s.id,p.id)>0));
  return [...arrived,...rest];
}
const total=pid=>allStops().reduce((n,s)=>n+atBar(s.id,pid),0);
function through(bar,pid){let n=0;for(const s of actual()){n+=atBar(s.id,pid);if(s.id===bar)return n;}return n;}
// Planned bar counts as skipped once we've arrived somewhere later in the night
function skipped(s){
  if(s.home||s.extra||visitOf(s.id).arrive||people().some(p=>atBar(s.id,p.id)>0))return false;
  const list=allStops(), i=list.indexOf(s);return list.slice(i+1).some(x=>visitOf(x.id).arrive);
}
// Where each milestone happened, if it has
function msHits(){
  const out=[];
  milestones.forEach(m=>{let n=0;for(const s of actual()){n+=atBar(s.id,m.pid);if(n>=m.n){out.push({...m,bar:s});break;}}});
  return out;
}
const visit=bar=>state&&state.visits&&state.visits[bar]||{};

// Reads: ask "anything new?" with an ETag. Unchanged answers (304) don't count against GitHub's limit.
// If a phone still gets rate-limited, read the raw file instead until the limit resets (may lag a few minutes).
let etag=null, rawUntil=0, lastLoad=0, lagging=false;
const RAW=`https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${REPO.branch}/counts.json`;
function apply(json){ if(dirty||saving)return; state=json; normalize(); online=true; renderAll(); }
async function load(force){
  if(!force&&Date.now()-lastLoad<25000)return;
  lastLoad=Date.now();
  try{
    if(!token&&Date.now()<rawUntil){
      const r=await fetch(RAW+"?t="+Math.floor(Date.now()/60000),{cache:"no-store"});
      if(r.ok){lagging=true;apply(await r.json());}
      return;
    }
    const h=hdr(); if(etag&&state)h["If-None-Match"]=etag;
    const r=await fetch(API+"counts.json",{headers:h,cache:"no-store"});
    if(r.status===304){lagging=false;return;}
    if(r.status===404){online=false;state=null;sha=null;return renderAll();}
    if(r.status===403||r.status===429){
      const reset=+r.headers.get("x-ratelimit-reset")||0;
      rawUntil=reset?reset*1000:Date.now()+3600000; lastLoad=0; return load(true);
    }
    if(!r.ok)throw new Error(r.status);
    etag=r.headers.get("etag"); const j=await r.json(); lagging=false;
    if(!dirty&&!saving)sha=j.sha;
    apply(JSON.parse(b64d(j.content)));
  }catch(e){ if(!state){online=false;renderAll();} }
}
function normalize(){
  state.people=state.people||defaultPeople.map(({id,name,proj,head})=>({id,name,proj,head}));
  ["bars","visits","photos","last"].forEach(k=>state[k]=state[k]||{});
  state.extra=state.extra||[];
}
function ensureState(){if(!state)state={};normalize();online=true;}
let pendingN=+(store.get("oct-pending-n")||0);
function queueSave(){
  dirty=true;pendingN++;store.set("oct-pending",JSON.stringify(state));store.set("oct-pending-n",pendingN);
  setStatus(navigator.onLine===false?`No signal · ${pendingN} change${pendingN>1?"s":""} waiting`:"Saving…");
  clearTimeout(saveTimer);saveTimer=setTimeout(save,1200);
}
async function save(retry=true){
  if(saving){saveTimer=setTimeout(save,800);return;}
  saving=true;dirty=false;
  try{
    if(!sha){const g=await fetch(API+"counts.json",{headers:hdr(),cache:"no-store"});if(g.ok)sha=(await g.json()).sha;}
    const body={message:"Score update",content:b64e(JSON.stringify(state,null,2))};if(sha)body.sha=sha;
    const r=await fetch(API+"counts.json",{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){const g=await fetch(API+"counts.json",{headers:hdr(),cache:"no-store"});if(g.ok)sha=(await g.json()).sha;saving=false;if(retry)return save(false);throw new Error("conflict");}
    if(r.status===401||r.status===403)throw new Error("key");
    if(!r.ok)throw new Error(r.status);
    sha=(await r.json()).content.sha; etag=null;
    if(!dirty){pendingN=0;store.set("oct-pending",null);store.set("oct-pending-n",null);}
    setStatus("Saved ✓");
  }catch(e){dirty=true;setStatus(e.message==="key"?"GitHub rejected the key. Sign out and back in.":`No signal · ${pendingN} change${pendingN>1?"s":""} waiting`);if(e.message!=="key")saveTimer=setTimeout(save,5000);}
  saving=false;
}

// Photos: resize on the phone, then commit to images/crawl/ in the repo
const cam=document.createElement("input");cam.type="file";cam.accept="image/*";cam.hidden=true;document.body.append(cam);
let camTarget=null;
cam.addEventListener("change",async()=>{
  const f=cam.files&&cam.files[0];cam.value="";if(!f||!camTarget)return;
  const {bar,pid}=camTarget, p=people().find(x=>x.id===pid), s=allStops().find(x=>x.id===bar);
  try{
    setStatus(`Uploading ${p.name}'s photo…`);
    const url=URL.createObjectURL(f), img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url;});
    const max=900, k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const data=c.toDataURL("image/jpeg",0.8);
    localPhotos[bar+"/"+pid]=data;renderAll();
    const path=`images/crawl/${bar}-${pid}-${Date.now()}.jpg`;
    const r=await fetch(API+path,{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({message:`Photo: ${p.name} at ${s.short}`,content:data.split(",")[1]})});
    if(!r.ok)throw new Error(r.status);
    ensureState();(state.photos[bar]=state.photos[bar]||{})[pid]=path;queueSave();
  }catch(e){setStatus("Photo didn't upload. Try again.");delete localPhotos[bar+"/"+pid];renderAll();}
});

document.addEventListener("click",e=>{
  if(!token)return;
  const a=e.target.closest("[data-adj]"), vs=e.target.closest("[data-visit]"), sn=e.target.closest("[data-snap]");
  if(e.target.closest("#addStop")){openAddStop();return;}
  const rmb=e.target.closest("[data-remove]");
  if(rmb){
    if(!rmb.dataset.sure){rmb.dataset.sure=1;rmb.textContent="Tap again to remove";rmb.classList.add("primary");return;}
    ensureState();const id=rmb.dataset.remove;
    state.extra.forEach(x=>{if(x.after===id)x.after=(state.extra.find(y=>y.id===id)||{}).after||"__start";});
    state.extra=state.extra.filter(x=>x.id!==id);delete state.bars[id];delete state.visits[id];delete state.photos[id];
    current="route";renderAll();show("route",true);queueSave();return;
  }
  if(sn){camTarget={bar:sn.dataset.snap,pid:sn.dataset.pid};cam.click();return;}
  if(!(a||vs))return;
  ensureState();
  if(a){const b=a.dataset.bar,id=a.dataset.adj,d=+a.dataset.d;const row=state.bars[b]=state.bars[b]||{};
    row[id]=Math.max(0,(row[id]||0)+d);if(total(id)>24)row[id]--; if(d>0)state.last[id]=new Date().toISOString(); if(navigator.vibrate)navigator.vibrate(15);}
  if(vs){const b=vs.dataset.visit,k=vs.dataset.k,v=state.visits[b]=state.visits[b]||{},now=new Date().toISOString();
    if(v[k]){delete v[k];if(k==="arrive")delete v.depart;}
    else{v[k]=now;if(k==="arrive")Object.entries(state.visits).forEach(([id,o])=>{if(id!==b&&o.arrive&&!o.depart)o.depart=now;});}}
  renderAll();queueSave();
});

        stop.lat=+pos.coords.latitude.toFixed(6);stop.lng=+pos.coords.longitude.toFixed(6);}catch(e){}

  };
}

  const heck=[["greg",16,"Greg, the couch misses you."],["travis",12,"Trav, drink a water. Love, me."],["bret",24,"Bret, you are buying breakfast."],["greg",10,"Double digits! Proud of you, honey."],["travis",20,"Uber is on its way. I already ordered it."]];
  return names.map((n,i)=>({name:n,ts:new Date(closesAt-3600000*(i+1)),bret:pick(21,2.5),travis:pick(16,3),greg:pick(13,3),
    target:heck[i]?heck[i][0]:"",at:heck[i]?heck[i][1]:null,comment:heck[i]?heck[i][2]:""}));
}
function parseGviz(txt){
  const j=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));
  const cols=j.table.cols.map(c=>(c.label||"").toLowerCase());
  const find=(...keys)=>cols.findIndex(c=>keys.some(k=>c.includes(k)));
  const ix={ts:find("timestamp"),name:find("your name","name"),bret:find("bret"),travis:find("travis","trav"),greg:find("greg"),target:find("whom","heckle who"),at:find("which beer","beer #","at beer"),comment:find("write your","comment","heckel")};
  const val=(r,i)=>i<0||!r.c[i]?null:r.c[i].v;
  const date=v=>{const m=/Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)/.exec(v||"");if(!m)return null;const p=n=>String(n).padStart(2,"0");
    return new Date(`${m[1]}-${p(+m[2]+1)}-${p(m[3])}T${p(m[4])}:${p(m[5])}:${p(m[6])}-05:00`);};
  const num=v=>v==null||v===""?null:Math.max(0,Math.min(24,Math.round(+v)));
  return j.table.rows.map(r=>({ts:date(val(r,ix.ts)),name:String(val(r,ix.name)||"").trim(),bret:num(val(r,ix.bret)),travis:num(val(r,ix.travis)),greg:num(val(r,ix.greg)),
    target:String(val(r,ix.target)||"").toLowerCase().replace(/^trav$/,"travis"),at:num(val(r,ix.at)),comment:String(val(r,ix.comment)||"").trim()})).filter(r=>r.name);
}
async function loadBets(force){
  if(!force&&Date.now()-betsLoadedAt<60000&&betRows)return renderBets();
  betsLoadedAt=Date.now();
  if(!betsReady()){betsDemo=true;betRows=betRows&&betsDemo?betRows:demoBets();return renderBets();}
  try{
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${BETS.sheetId}/gviz/tq?tqx=out:json&gid=${BETS.sheetGid}&t=${Date.now()}`,{cache:"no-store"});
    betRows=parseGviz(await r.text());betsDemo=false;
  }catch(e){if(!betRows)betRows=[];}
  renderBets();
}
// One bet per person: their latest before betting closed
function validBets(){
  const by={};
  (betRows||[]).filter(r=>!r.ts||r.ts<=closesAt).forEach(r=>{const k=r.name.toLowerCase();if(!by[k]||(r.ts&&by[k].ts&&r.ts>by[k].ts))by[k]=r;});
  return Object.values(by);
}
function statsFor(pid){
  const v=validBets().map(b=>b[pid]).filter(x=>x!=null);
  if(!v.length)return null;
  const n=v.length, mean=v.reduce((a,b)=>a+b,0)/n, sd=n>1?Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):0;
  return {n,mean,sd,vals:v};
}
const pct=x=>Math.max(0,Math.min(100,x/24*100));
function trackHTML(p,st,live){
  const m=pct(st.mean), r=pct(st.mean+Math.max(st.sd,0.5));
  const bg=`linear-gradient(90deg,var(--g) 0%,var(--g) ${m}%,var(--r) ${r}%,var(--r) 100%)`;
  const stack={};
  const dots=st.vals.map(v=>{const k=stack[v]=(stack[v]||0)+1;return `<i class="dot" style="left:${pct(v)}%;bottom:${(k-1)*9}px"></i>`;}).join("");
  const h=Math.max(...Object.values(stack))*9+4;
  return `<div class="track">
    <div class="dots" style="height:${h}px">${dots}</div>
    <div class="barwrap"><div class="bar" style="background:${bg}"></div><div class="mean" style="left:${m}%"></div>
      ${live!=null&&online?`<img class="livept" style="left:${pct(live)}%" src="images/beer.png" alt="${p.name} is at ${live}">`:""}</div>
    <div class="ticks">${[0,6,12,18,24].map(t=>`<span style="left:${pct(t)}%">${t}</span>`).join("")}</div>
    <div class="meanrow"><span style="left:${Math.min(86,Math.max(14,m))}%">Crowd ${st.mean.toFixed(1)}</span></div></div>`;
}
function verdict(p,st,live){
  const hi=Math.round(st.mean+st.sd), lo=Math.max(0,Math.round(st.mean-st.sd));
  const beyond=st.vals.filter(v=>v>hi).length;
  let txt=`Most bets land between ${lo} and ${hi}${beyond?`; only ${beyond} of ${st.n} think he gets past ${hi}`:`; nobody thinks he gets past ${hi}`}.`;
  if(live!=null&&online&&live>0){
    txt+=` <b class="now">He's at ${live}.</b> `+(live>st.mean+st.sd?"Deep in the red. Nobody saw this coming.":live>st.mean?"Past the crowd's average and into the fade.":`${(st.mean-live).toFixed(1)} to go to the crowd's average.`);
  }
  return txt;
}
function renderBets(){
  const el=document.getElementById("betsBody"); if(!el)return;
  const ps=people(), open=betsOpen(), bets=validBets();
  const mins=Math.max(0,Math.round((closesAt-Date.now())/60000));
  const left=mins>=60?`${Math.floor(mins/60)} hr ${mins%60} min`:`${mins} min`;
  const heckles=bets.filter(b=>b.comment&&b.target);
  el.innerHTML=`
    <p class="sub">${open?`Betting closes at 2:00 PM Saturday, in ${left}. One bet per name; your latest counts.`:`Betting closed at 2:00 PM. ${bets.length} bet${bets.length===1?"":"s"} in.`}</p>
    ${betsDemo?`<div class="banner"><div class="bn">Example bets</div><p>These are made up so you can see how it works. Real bets show here once the betting form is connected.</p></div>`:""}
    <div class="key"><span><i style="background:var(--g)"></i>Up to the crowd's average</span><span><i style="background:linear-gradient(90deg,var(--g),var(--r))"></i>Fading over 1 std dev</span><span><i style="background:var(--r)"></i>Nobody believes in you</span></div>
    ${ps.map(p=>{const st=statsFor(p.id);return `<div class="betcard">
      <div class="bh">${faceHTML(p,latestPhoto(p.id))}<div><b>${p.name}</b><span>${st?`${st.n} bet${st.n===1?"":"s"} · ±${st.sd.toFixed(1)}`:"No bets yet"}</span></div></div>
      ${st?trackHTML(p,st,state?total(p.id):null)+`<p class="vd">${verdict(p,st,state?total(p.id):null)}</p>`:""}</div>`;}).join("")}
    ${open&&!betsDemo?formHTML(ps):open&&betsDemo?`<p class="sub" style="margin-top:16px">The betting form appears here once it's connected.</p>`:""}
    <h3>Heckles</h3>
    ${heckles.length?`<ul class="list">${heckles.sort((a,b)=>(a.at||0)-(b.at||0)).map(h=>{const p=ps.find(x=>x.id===h.target);if(!p)return "";
      const unlocked=h.at==null||(state&&total(p.id)>=h.at);
      return `<li class="${unlocked?"":"locked"}"><b>${p.name}${h.at!=null?` at beer ${h.at}`:""}:</b> ${unlocked?`“${h.comment}” <span class="by">— ${h.name}</span>`:`Locked until ${p.name} hits ${h.at}. From ${h.name}.`}</li>`;}).join("")}</ul>`:`<p class="sub">No heckles yet.</p>`}
    ${!open&&bets.length&&online?leaderHTML(ps,bets):""}`;
}
function leaderHTML(ps,bets){
  const sc=bets.map(b=>({name:b.name,err:ps.reduce((n,p)=>n+(b[p.id]==null?24:Math.abs(b[p.id]-total(p.id))),0)})).sort((a,b)=>a.err-b.err).slice(0,5);
  return `<h3>Closest bettors (if the night ended now)</h3><ul class="list">${sc.map((s,i)=>`<li><b>${i+1}. ${s.name}</b> · off by ${s.err} beer${s.err===1?"":"s"} total</li>`).join("")}</ul>`;
}
function formHTML(ps){
  const opts=Array.from({length:25},(_,k)=>`<option value="${k}">${k}</option>`).join("");
  return `<h3>Place your bet</h3><form class="betform" id="betform">
    <label>Your name<input id="bName" required maxlength="40" autocomplete="given-name" placeholder="So we know who to brag about"></label>
    <div class="fhead"><b>How many beers until they quit?</b><span>Pick a number from 0 to 24 for each guy.</span></div>
    <div class="bgrid">${ps.map(p=>`<label>${p.name}<select id="b-${p.id}" required><option value="">Pick</option>${opts}</select></label>`).join("")}</div>
    <div class="fhead"><b>Leave a heckle (optional)</b><span>It stays hidden until he hits the beer you pick, then pops up for everyone.</span></div>
    <div class="bgrid"><label>Who's it for?<select id="hWho"><option value="">Pick a guy</option>${ps.map(p=>`<option value="${p.name}">${p.name}</option>`).join("")}</select></label>
      <label>Show it at beer #<select id="hAt"><option value="">Pick</option>${opts}</select></label></div>
    <label>Your heckle<input id="hText" maxlength="140" placeholder="Greg, the couch misses you."></label>
    <div class="err" id="betErr"></div>
    <button class="btn primary" type="submit" style="width:100%">Lock in my bet</button></form>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="betform")return;e.preventDefault();
  const err=document.getElementById("betErr"),E=BETS.entries,ps=people();
  if(!betsOpen()){err.textContent="Betting closed at 2:00 PM.";return;}
  const f=new URLSearchParams();
  f.append(E.name,document.getElementById("bName").value.trim());
  ps.forEach(p=>E[p.id]&&f.append(E[p.id],document.getElementById("b-"+p.id).value));
  const who=document.getElementById("hWho").value,at=document.getElementById("hAt").value,txt=document.getElementById("hText").value.trim();
  if(txt&&!who){err.textContent="Pick who the heckle is for.";return;}
  if(who&&E.target)f.append(E.target,who); if(at&&E.at)f.append(E.at,at); if(txt&&E.comment)f.append(E.comment,txt);
  err.textContent="Sending…";
  try{await fetch(BETS.formAction,{method:"POST",mode:"no-cors",body:f});
    err.textContent="Bet locked in. It'll show up in a few seconds.";e.target.reset();setTimeout(()=>loadBets(true),4000);
  }catch(x){err.textContent="Couldn't send. Check your signal and try again.";}
});
setInterval(()=>{if(current==="bets"&&!document.hidden)loadBets();},60000);

if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js");}
